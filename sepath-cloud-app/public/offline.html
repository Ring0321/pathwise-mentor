<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>SE-Path 学伴离线试用</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        border: 1px solid #bfdbfe;
        background: #ffffff;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.8;
        color: #334155;
      }

      code {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid #dbeafe;
        border-radius: 999px;
        color: #1d4ed8;
        background: #eff6ff;
      }

      a {
        color: #1d4ed8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SE-Path 学伴离线试用入口</h1>
      <p>
        当前网络不可用，公开试用包已进入离线容灾模式。若你曾经成功打开过首页，浏览器通常会直接回退到缓存的
        <code>index.html</code>；如果仍停留在本页，请恢复网络后刷新。
      </p>
      <p>
        本离线页只说明访问状态，不包含真实学生数据、账号密码、API Key 或学校生产信息。评委仍可查看提交包中的
        <code>PUBLIC_TRIAL_MANIFEST.json</code>、<code>JUDGE_DEMO_SEED_MANIFEST.json</code> 和技术验收包。
      </p>
      <p><a href="/">重新打开 SE-Path 学伴</a></p>
    </main>
  </body>
</html>
